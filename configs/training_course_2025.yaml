defaults:
- data: zarr
- dataloader: native_grid_red
- datamodule: single
- diagnostics: evaluation
- hardware: example
- graph: multi_scale
- model: graphtransformer
- training: default
- _self_

config_validation: True

### This file is for local experimentation.
##  When you commit your changes, assign the new features and keywords
##  to the correct defaults.
# For example to change from default GPU count:
# hardware:
#   num_gpus_per_node: 1

hardware:
  paths:
    data: /datasets/
    output: /home/student/
  files:
    dataset: aifs-ea-an-oper-0001-mars-o48-2010-2022-6h-v1-toy.zarr
  accelerator: auto
  num_nodes: 1
  num_gpus_per_model: 1
model:
  num_channels: 256
dataloader:
  batch_size:
    training: 8
    validation: 8
  limit_batches:
    training: 100
    validation: 100
training:
  max_steps: 100000
#  print_memory_summary: True
  lr:
    rate: 0.625e-4 #local_lr
    iterations: ${training.max_steps} # NOTE: When max_epochs < max_steps, scheduler will run for max_steps
    min: 3e-7 #Not scaled by #GPU
  variable_groups:
    default: sfc
    pl:
     param: [t, z]
  metrics:
  - z_500
  - t_850


diagnostics:
  plot:
    parameters:
    - z_500
    - t_850
    - 2t
    - tp
    - cp
  log:
    mlflow:
      system: True
